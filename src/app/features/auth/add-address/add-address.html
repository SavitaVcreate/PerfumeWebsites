<div class="container-fluid profile-page">
    <div class="row">
        <div class="col-lg-3 col-md-4 pt-5">
            <app-sidebar></app-sidebar>
        </div>
        <div class="col-lg-9">
            <div class="address-container">
                <h4 class="fw-bold mb-3 text-white">Manage Addresses</h4>
                <div class="add-address-card" *ngIf="!showAddressForm">
                    <button class="add-address-btn" (click)="openAddressForm()"><i class="bi bi-plus-lg"></i> ADD A NEW
                        ADDRESS </button>
                </div>
                <div *ngIf="!showAddressForm">
                    <div class="address-card" *ngFor="let item of addresses">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="address-type"> {{item.addressType}} </span>
                            <div>
                                <!-- 
                    <button class="btn btn-sm btn-outline-primary me-2"
                        (click)="editAddress(item)">
                        Edit
                    </button> -->

                                <!-- <button class="btn btn-sm btn-outline-danger" (click)="deleteAddress(item._id)">
                                    Delete
                                </button> -->
                                <button class="btn btn-sm btn-danger" (click)="deleteAddress(item._id)"
                                    title="Delete Address"> <i class="bi bi-trash"></i> </button>
                            </div>
                        </div>
                        <h5 class="mt-3"> {{item.fullName}} <span class="ms-3"> {{item.mobileNo}} </span> </h5>
                        <p class="mb-0"> {{item.address}}, {{item.locality}},{{item.city}},{{item.state}}
                            -{{item.pincode}} </p>
                        <p class="mb-0" *ngIf="item.landmark"><strong>Landmark :</strong>{{item.landmark}}</p>
                        <p class="mb-0" *ngIf="item.alternatePhone"> <strong>Alternate Phone :</strong>
                            {{item.alternatePhone}} </p>
                    </div>
                </div>
                <div class="card border-0 shadow-sm" *ngIf="showAddressForm">
                    <div class="card-header"> </div>
                    <div class="card-body">
                        <button class="btn btn-primary location-btn mb-4"> <i class="bi bi-geo-alt-fill"></i> Use my
                            current location </button>
                        <form [formGroup]="addressForm" (ngSubmit)="saveAddress()">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <input type="text" class="form-control" placeholder="Name"
                                        formControlName="fullName">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <input type="text" class="form-control" placeholder="10-digit mobile number"
                                        formControlName="mobileNo">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <input type="text" class="form-control" placeholder="Pincode"
                                        formControlName="pincode">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <input type="text" class="form-control" placeholder="Locality"
                                        formControlName="locality">
                                </div>
                                <div class="col-12 mb-3">
                                    <textarea rows="4" class="form-control" placeholder="Address (Area and Street)"
                                        formControlName="address"></textarea>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <input type="text" class="form-control" placeholder="City" formControlName="city">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <select class="form-select" formControlName="state">
                                        <option value=""> --Select State-- </option>
                                        <option>Maharashtra</option>
                                        <option>Gujarat</option>
                                        <option>Karnataka</option>
                                        <option>Delhi</option>
                                        <option>Goa</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <input type="text" class="form-control" placeholder="Landmark"
                                        formControlName="landmark">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <input type="text" class="form-control" placeholder="Alternate Phone"
                                        formControlName="alternatePhone">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="fw-bold mb-2"> Address Type </label>
                                <div class="d-flex gap-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" value="Home"
                                            formControlName="addressType">
                                        <label class="form-check-label"> Home</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" value="Work"
                                            formControlName="addressType">
                                        <label class="form-check-label"> Work </label>
                                    </div>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary px-5"> Save</button>
                            <button type="button" class="btn btn-link text-decoration-none ms-3"
                                (click)="closeAddressForm()"> CANCEL</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
