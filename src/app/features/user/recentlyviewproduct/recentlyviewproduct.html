<app-navbar></app-navbar>
<section class="recently-viewed-section">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <button class="btn btn-outline-danger btn-sm" (click)="clearHistory()"> Clear History </button>
        </div>
        <div class="row">
            <div class="col-lg-3 col-md-4 col-6 mb-4" *ngFor="let product of products">
                <div class="card product-card h-100 shadow-sm border-0">
                    <div class="product-image">
                        <img [src]="'http://localhost:5000/uploads/profile/' + product.mainImage" class="product-img">
                        <span class="discount-badge" *ngIf="product.discount"> {{product.discount}}% OFF </span>
                    </div>
                    <div class="card-body">
                        <small class="text-muted"> {{product.brand}} </small>
                        <h6 class="fw-bold mt-2"> {{product.productName}} </h6>
                        <div>
                            <span class="fw-bold fs-5"> <img src="/assets/logo/Currency Symbol.jpg" alt="AED"
                                    class="currency-icon" style="width:20px,">{{product.sellingPrice}} </span>

                            <span class="text-muted text-decoration-line-through ms-2">
                                <img src="/assets/logo/Currency Symbol.jpg" alt="AED" class="currency-icon"
                                    style="width:20px,">{{product.mrp}}
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="container py-5 text-center" *ngIf="products.length==0">
        <img src="/perumes/rencentlyview.png" width="180">
        <h5 class="mt-3"> No Recently Viewed Products</h5>
        <p class="text-muted">Start exploring perfumes and they will appear here. </p>
    </div>
</section>
